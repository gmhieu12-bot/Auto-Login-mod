plugins {
    id 'base'
}

allprojects {
    group = project.maven_group
    version = project.mod_version
}

// Aggregator task: runs build on both subprojects and copies both JARs into root build/libs
tasks.register('copyArtifacts', Copy) {
    dependsOn subprojects.collect { it.tasks.named('build') }
    subprojects.each { subproject ->
        from(subproject.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar'
        }
    }
    into layout.buildDirectory.dir('libs')
}

tasks.named('build') {
    dependsOn tasks.named('copyArtifacts')
}
